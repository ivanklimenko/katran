name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # check:install открывает страницы в Chromium Playwright; скрипты установки пакетов закрыты
      # (onlyBuiltDependencies), поэтому браузер ставится отдельным шагом
      - run: pnpm exec playwright install --with-deps chromium
      # тарболы из pnpm check ставятся через npm в чистый проект — так пакеты получает хост
      - run: pnpm check:install

  react19:
    runs-on: ubuntu-latest
    env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: node scripts/use-react.mjs 19
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @katran/tokens --filter @katran/ui --filter @katran/effector run test
      - run: pnpm --filter @katran/tokens --filter @katran/ui --filter @katran/effector run build
